plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

group = 'it.unicam.cs.mpgc.rpg122532'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation("org.openjfx:javafx-controls:21.0.7")
    implementation("org.openjfx:javafx-fxml:21.0.7")
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation('com.calendarfx:view:11.8.3')
}

test {
    useJUnitPlatform()
}

javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg122532.Main'
}
